[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdg-pgms"
version = "0.1.0"
description = "Probabilistic Graphical Models for Synthetic Data Generation"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "NVIDIA Corporation"}]
requires-python = ">=3.10"
dependencies = [
    "data-designer>=0.5.6,<0.6",
    "numpy>=2.0,<3",
    "pandas>=2.0,<3",
    "pgmpy>=0.1.26,<0.2",
    "pyarrow>=19.0,<20",
    "pydantic>=2.0,<3",
    "scipy>=1.14,<2",
    "smart-open>=7.0,<8",
    "torch>=2.0,<3",
    "rich>=13.0,<15",
]

[project.urls]
Homepage = "https://github.com/NVIDIA-NeMo/SDG-PGMs"
Repository = "https://github.com/NVIDIA-NeMo/SDG-PGMs"
Issues = "https://github.com/NVIDIA-NeMo/SDG-PGMs/issues"

[dependency-groups]
dev = ["pytest>=8.0,<9", "ruff>=0.5"]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["pgms", "data_designer_plugins"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# Register data designer plugin
[project.entry-points."data_designer.plugins"]
pgm-generator = "data_designer_plugins.pgm_generator_plugin:plugin"
